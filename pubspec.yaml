name: medishare
description: Smart Medical Equipment Network
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  provider: ^6.1.5

  # Routing
  go_router: ^16.0.0

  # Network
  dio: ^5.7.0

  # Secure Storage (JWT)
  flutter_secure_storage: ^9.2.2

  # Shared Preferences (onboarding seen flag)
  shared_preferences: ^2.3.3

  # UI
  google_fonts: ^6.3.1
  lottie: ^3.3.2
  image_picker: ^1.2.3
  permission_handler: ^12.0.3

  # Location
  geolocator: ^13.0.2

  # Map (used by Live Tracking)
  flutter_map: ^8.1.1
  latlong2: ^0.9.1

  # Crypto (Razorpay signature verification)
  crypto: ^3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/